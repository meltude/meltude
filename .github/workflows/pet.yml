name: My YourTomo cat
on:
  push:
    branches:
      - main
  schedule:
    - cron: '23 */6 * * *'   
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prsdx/YourTomo@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: meltude        
          timezone-offset-minutes: "120"
